name: Verify migration status

on:
  workflow_call:
    inputs:
      legacy_check_name:
        description: Name of the existing check run to compare
        required: true
        type: string
      new_workflow_name:
        description: Name of the newly onboarded workflow to compare
        required: true
        type: string

permissions:
  actions: read
  checks: read
  contents: read
  statuses: write

jobs:
  compare:
    name: Compare completed results
    if: github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # workflow_run has a write token. Load the comparison code from the trusted
      # default branch, never from the pull request being evaluated.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/workflows/verify-run-status.js
          sparse-checkout-cone-mode: false

      - name: Compare and report on the pull request
        uses: actions/github-script@v7
        env:
          LEGACY_CHECK_NAME: ${{ inputs.legacy_check_name }}
          NEW_WORKFLOW_NAME: ${{ inputs.new_workflow_name }}
        with:
          script: |
            const { verifyRunStatus } = require(
              process.env.GITHUB_WORKSPACE + '/.github/workflows/verify-run-status.js'
            );
            await verifyRunStatus({
              github,
              context,
              core,
              legacyCheckName: process.env.LEGACY_CHECK_NAME,
              newWorkflowName: process.env.NEW_WORKFLOW_NAME,
            });
